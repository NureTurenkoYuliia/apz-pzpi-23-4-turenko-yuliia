version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cleanarium-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CleanArium123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: