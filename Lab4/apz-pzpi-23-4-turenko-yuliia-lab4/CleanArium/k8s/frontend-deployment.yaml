apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanarium-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cleanarium-web
  template:
    metadata:
      labels:
        app: cleanarium-web
    spec:
      containers:
      - name: cleanarium-web
        image: cleanarium-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80