apiVersion: apps/v1
kind: Deployment

metadata:
  name: cleanarium-sql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cleanarium-sql

  template:
    metadata:
      labels:
        app: cleanarium-sql

    spec:
      containers:
      - name: sqlserver

        image: mcr.microsoft.com/mssql/server:2022-latest

        ports:
        - containerPort: 1433

        env:
        - name: ACCEPT_EULA
          value: "Y"

        - name: MSSQL_SA_PASSWORD
          value: "CleanArium123!"