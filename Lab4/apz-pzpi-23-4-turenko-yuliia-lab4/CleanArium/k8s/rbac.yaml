apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanarium-admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanarium-admin-role

rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - get
      - list
      - watch
      - update
      - patch

  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanarium-admin-binding

subjects:
  - kind: ServiceAccount
    name: cleanarium-admin

roleRef:
  kind: Role
  name: cleanarium-admin-role
  apiGroup: rbac.authorization.k8s.io